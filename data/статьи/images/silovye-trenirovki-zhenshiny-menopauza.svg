  <path d="M360 175 L400 120 L440 175" stroke="#4F9B8E" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- dumbbell, strength, placed lower so it doesn't cross the arrow -->
