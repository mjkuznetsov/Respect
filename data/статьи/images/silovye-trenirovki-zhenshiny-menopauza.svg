    <rect x="210" y="355" width="26" height="70" rx="10"/>
    <rect x="564" y="355" width="26" height="70" rx="10"/>
    <rect x="250" y="378" width="300" height="24" rx="12"/>
    <rect x="195" y="368" width="16" height="44" rx="8"/>
    <rect x="589" y="368" width="16" height="44" rx="8"/>
  </g>
</svg>
