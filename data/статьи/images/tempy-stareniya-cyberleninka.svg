  <circle cx="330" cy="225" r="110" fill="#FDFDFB"/>
  <circle cx="330" cy="225" r="110" fill="none" stroke="#4F7CAC" stroke-width="12"/>
  <circle cx="330" cy="225" r="10" fill="#4F7CAC"/>
